name: Build macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:macos
      - run: node tests/mac-package-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bolt-v1-oak-macOS-${{ matrix.arch }}
          path: |
            releases/*-macOS-${{ matrix.arch }}.zip
            releases/*-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
